<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>لوحة التحكم | Future Students</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <!-- <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script> -->
</head>
<body>
<div class="app-layout">
  <div id="sidebarMount"></div>
  <main class="main-content">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="hamburger" id="hamburgerBtn">☰</button>
        <span class="topbar-title">📊 لوحة التحكم</span>
      </div>
      <div class="topbar-right">
        <div class="user-avatar" id="userAvatar">?</div>
        <span class="user-name" id="userName">مستخدم</span>
        <button onclick="Auth.logout()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:4px;">🚪</button>
      </div>
    </header>
    <div class="page-content">

      <div class="welcome-banner fade-in">
        <div class="welcome-name">مرحباً، <span id="wName">---</span> 👋</div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px;">لوحة التحكم العامة — Future Students</div>
      </div>

      <div class="stats-grid fade-in-1">
        <div class="stat-card"><div class="stat-icon">👥</div><div><div class="stat-value">312</div><div class="stat-label">إجمالي الطلاب</div></div></div>
        <div class="stat-card"><div class="stat-icon">🏷️</div><div><div class="stat-value">8</div><div class="stat-label">سكاشن</div></div></div>
        <div class="stat-card"><div class="stat-icon">📚</div><div><div class="stat-value">6</div><div class="stat-label">مواد دراسية</div></div></div>
        <div class="stat-card"><div class="stat-icon">⚡</div><div><div class="stat-value">24</div><div class="stat-label">مهارة مقترحة</div></div></div>
      </div>

      <div class="grid-2 fade-in-2" style="margin-bottom:16px;">
        <div class="card">
          <div class="card-title">📊 توزيع الطلاب على السكاشن</div>
          <canvas id="secChart" style="max-height:200px;"></canvas>
        </div>
        <div class="card">
          <div class="card-title">📚 توزيع الطلاب على المواد</div>
          <canvas id="subChart" style="max-height:200px;"></canvas>
        </div>
      </div>

      <div class="card fade-in-3">
        <div class="card-title">🏷️ السكاشن — اضغط لرؤية الطلاب</div>
        <div id="secList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:4px;"></div>
      </div>

      <div class="card fade-in-4" style="margin-top:14px;">
        <div class="card-title">🔍 بحث سريع عن طالب</div>
        <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;">
          <input type="text" class="input-field" id="searchInput" placeholder="ابحث بالاسم أو الكود..." style="flex:1;min-width:160px;">
          <select class="input-field" id="secFilter" style="width:auto;">
            <option value="0">كل السكاشن</option>
          </select>
        </div>
        <div id="searchCount" style="font-size:12px;color:var(--muted);margin-bottom:10px;"></div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>#</th><th>الاسم</th><th>الكود</th><th>Section</th></tr></thead>
            <tbody id="searchBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </main>
</div>
<script src="data/students.js"></script>
<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
