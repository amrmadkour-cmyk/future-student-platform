<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Future Students | HITU</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="scan-line"></div>
<div class="particles" id="particles"></div>

<svg class="corner-deco tr" viewBox="0 0 220 220" fill="none">
  <circle cx="220" cy="0" r="160" stroke="#c9a84c" stroke-width="1"/>
  <circle cx="220" cy="0" r="110" stroke="#2451a0" stroke-width="1"/>
  <circle cx="220" cy="0" r="60"  stroke="#c9a84c" stroke-width="0.5"/>
</svg>
<svg class="corner-deco bl" viewBox="0 0 220 220" fill="none">
  <circle cx="220" cy="0" r="160" stroke="#c9a84c" stroke-width="1"/>
  <circle cx="220" cy="0" r="110" stroke="#2451a0" stroke-width="1"/>
  <circle cx="220" cy="0" r="60"  stroke="#c9a84c" stroke-width="0.5"/>
</svg>

<div class="landing">
  <div class="logo-wrap"><img src="assets/logo.jpg" alt="HITU"></div>
  <p class="uni-tag">HELWAN INT'L TECHNOLOGICAL UNIVERSITY — HITU</p>
  <div class="main-title">
    <div class="future-text">FUTURE</div>
    <div class="students-text">STUDENTS</div>
    <div class="arabic-sub">بوابتك الأكاديمية الذكية</div>
  </div>
  <div class="divider"></div>
  <div class="motiv">
    <p class="motiv-text">مرحباً بك في منصتك التعليمية — حيث <span class="hl">التعلم يلتقي بالتكنولوجيا</span>، ومستقبلك يبدأ من هنا 🚀</p>
    <p class="typing-line"><span id="typingText"></span><span class="cursor"></span></p>
  </div>
  <div class="btn-wrap">
    <a href="login.html" class="enter-btn"><span>ابدأ رحلتك الآن</span><span class="btn-icon">←</span></a>
  </div>
  <div class="team-section">
    <div class="dev-wrap">
      <span class="dev-label">مطوّرة النظام</span>
      <span class="dev-sep"></span>
      <span class="dev-name-val">إيمان عيد السيد</span>
    </div>
  </div>
</div>

<script src="js/index.js"></script>
</body>
</html>
