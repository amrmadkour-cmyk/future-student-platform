<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>ملفي الشخصي | Future Students</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body>
<div class="app-layout">
  <div id="sidebarMount"></div>
  <main class="main-content">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="hamburger" id="hamburgerBtn">☰</button>
        <span class="topbar-title">👤 ملفي الشخصي</span>
      </div>
      <div class="topbar-right">
        <div class="user-avatar" id="userAvatar">?</div>
        <span class="user-name" id="userName">مستخدم</span>
        <button onclick="Auth.logout()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:4px;">🚪</button>
      </div>
    </header>
    <div class="page-content">
      <div class="profile-grid">

        <!-- Profile Card -->
        <div class="profile-card fade-in">
          <div class="p-avatar" id="bigAvatar">?</div>
          <div class="p-name"  id="pName">---</div>
          <div class="p-email" id="pEmail">---</div>
          <span class="p-badge">🎓 CS Department — HITU</span>
          <div class="stats-mini">
            <div class="sm"><div class="sm-v">6</div><div class="sm-l">مواد</div></div>
            <div class="sm"><div class="sm-v">312</div><div class="sm-l">زميل</div></div>
            <div class="sm"><div class="sm-v">24</div><div class="sm-l">مهارة</div></div>
            <div class="sm"><div class="sm-v">HITU</div><div class="sm-l">جامعة</div></div>
          </div>
          <button class="logout-btn" onclick="Auth.logout()">🚪 تسجيل الخروج</button>
        </div>

        <!-- Edit Form -->
        <div class="fade-in-1">
          <div class="form-card" style="margin-bottom:14px;">
            <div class="form-title">✏️ تعديل البيانات</div>
            <div class="row-2">
              <div class="input-group"><label class="input-label">الاسم الأول</label><input type="text" class="input-field" id="fName"></div>
              <div class="input-group"><label class="input-label">اسم العائلة</label><input type="text" class="input-field" id="lName"></div>
            </div>
            <div class="input-group"><label class="input-label">البريد الإلكتروني</label><input type="email" class="input-field" id="fEmail"></div>
            <div class="input-group"><label class="input-label">التخصص</label><input type="text" class="input-field" value="Computer Science" readonly style="opacity:.6;"></div>
            <button class="save-btn" onclick="saveProfile()">💾 حفظ التغييرات</button>
          </div>
          <div class="form-card">
            <div class="form-title">🔒 تغيير كلمة المرور</div>
            <div class="row-2">
              <div class="input-group"><label class="input-label">كلمة المرور الجديدة</label><input type="password" class="input-field" id="newPass" placeholder="كلمة مرور جديدة"></div>
              <div class="input-group"><label class="input-label">تأكيد</label><input type="password" class="input-field" id="confPass" placeholder="أعد الكتابة"></div>
            </div>
            <button class="save-btn" onclick="savePassword()">🔐 تغيير كلمة المرور</button>
          </div>
        </div>

      </div>
    </div>
  </main>
</div>
<div id="globalToast" class="toast"></div>
<script src="data/students.js"></script>
<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
