<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>داش بورد الطالب | Future Students</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/my-dashboard.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>
<div class="app-layout">
  <div id="sidebarMount"></div>
  <main class="main-content">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="hamburger" id="hamburgerBtn">☰</button>
        <span class="topbar-title">🎓 داش بورد الطالب</span>
      </div>
      <div class="topbar-right">
        <div class="user-avatar" id="userAvatar">?</div>
        <span class="user-name" id="userName">مستخدم</span>
        <button onclick="Auth.logout()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:4px;">🚪</button>
      </div>
    </header>
    <div class="page-content" id="pageContent"></div>
  </main>
</div>

<!-- Code Entry Modal -->
<div class="code-modal" id="codeModal">
  <div class="code-card">
    <div style="text-align:center;font-size:36px;margin-bottom:10px;">🎓</div>
    <div class="code-title">داش بورد الطالب الشخصي</div>
    <div class="code-sub">أدخل كودك الجامعي لترى بياناتك ودرجاتك</div>
    <div class="code-err" id="codeErr"></div>
    <div class="ig" style="margin-bottom:12px;">
      <label class="input-label">الكود الجامعي</label>
      <input type="text" class="input-field" id="codeInput" placeholder="مثال: 2430400" inputmode="numeric" autocomplete="off">
    </div>
    <button class="btn btn-primary" style="width:100%;padding:12px;border-radius:11px;font-size:14px;font-weight:700;" onclick="submitCode()">
      <span id="codeBtnText">دخول ←</span>
    </button>
    <div style="text-align:center;margin-top:12px;">
      <a href="dashboard.html" style="font-size:12px;color:var(--muted);">← العودة للوحة التحكم</a>
    </div>
  </div>
</div>

<script src="data/students.js"></script>
<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/my-dashboard.js"></script>
</body>
</html>
